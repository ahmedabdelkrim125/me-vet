name: mivet_app
description: MIVET Sales — Flutter starter (modern UI, Cairo + Almarai fonts)
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    # ضع ملفات الخط دي جوه assets/fonts قبل ما تشغل المشروع
    # نفس الملفات اللي عندك في مشروع Warraq (assets/fonts)
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
    - family: Almarai
      fonts:
        - asset: assets/fonts/Almarai-Regular.ttf
          weight: 400
        # لو عندك أوزان تانية لـ Almarai (Light / Bold / ExtraBold) ضيفها هنا بنفس الطريقة
        # - asset: assets/fonts/Almarai-Bold.ttf
        #   weight: 700