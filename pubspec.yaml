name: mivet_app
description: MIVET Sales — Flutter starter (modern UI, Cairo + Almarai fonts)
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  google_nav_bar: ^5.0.7
  hugeicons: ^1.1.7
  shared_preferences: ^2.5.5
  flutter_launcher_icons: ^0.14.4
  liquid_glass_bottom_nav: ^0.0.9
  flashy_tab_bar2: ^0.0.10
  url_launcher: ^6.3.1
  image_picker: ^1.2.3
  pdf: ^3.12.0
  printing: ^5.14.3
  font_awesome_flutter: ^11.0.0
  supabase_flutter: ^2.17.2
  flutter_dotenv: ^5.2.1
  flutter_bloc: ^9.1.1
  equatable: ^2.1.0
  fl_chart: ^1.2.0
  geolocator: ^13.0.2
  geocoding: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - .env

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
    - family: Almarai
      fonts:
        - asset: assets/fonts/Almarai-Regular.ttf
          weight: 400
    - family: typokar
      fonts:
        - asset: assets/fonts/typokar.ttf
    - family: Wessam
      fonts:
        - asset: assets/fonts/a-arslan-wessam-b.ttf

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo_splash.png"