workflows:
  android-automated-build:
    name: Android APK Build & Email Testers
    instance_type: mac_mini_m1
    max_build_duration: 120

    environment:
      flutter: stable

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: '*'
          include: true
          source: true

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Build Android APK
        script: flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk

    publishing:
      email:
        recipients:
          - ahmedabdelkrim125@gmail.com
          - ahmed85814@gmail.com
        notify:
          success: true
          failure: true